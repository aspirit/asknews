# Local development database. Start with `docker compose up -d`.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: asknews
      POSTGRES_PASSWORD: asknews
      POSTGRES_DB: asknews
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asknews -d asknews"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
