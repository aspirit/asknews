# nginx server block for asknews.jp. Place in /etc/nginx/sites-available and
# enable it; run certbot afterwards to add TLS.
server {
    listen 80;
    listen [::]:80;
    server_name asknews.jp www.asknews.jp;
    # Its own file: the host serves other sites, and the shared log has no host field.
    access_log /var/log/nginx/asknews.access.log;

    # Static files are served by the application; cache them at the edge.
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # The daily job and the API documentation are not public.
    location /api/docs { return 404; }
}
