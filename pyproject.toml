[project]
name = "asknews"
version = "0.1.0"
description = "Bilingual question answering over central bank communications, with cited sources"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yan" }]
requires-python = ">=3.13,<3.14"
keywords = ["rag", "retrieval", "question-answering", "central-banks", "japanese", "english"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Natural Language :: Japanese",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Indexing",
]
dependencies = []

[project.urls]
Repository = "https://github.com/aspirit/asknews"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asknews"]
