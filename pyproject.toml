[project]
name = "asknews"
version = "0.1.0"
description = "Bilingual question answering over central bank communications, with cited sources"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yan" }]
requires-python = ">=3.13,<3.14"
keywords = ["rag", "retrieval", "question-answering", "central-banks", "japanese", "english"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Natural Language :: Japanese",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.10",
]

[project.urls]
Repository = "https://github.com/aspirit/asknews"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asknews"]

[dependency-groups]
dev = [
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.13",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "SIM",      # simplify
  "C4",       # comprehensions
  "PT",       # pytest style
  "RUF",      # ruff-specific
  "N",        # naming
  "ARG",      # unused arguments
  "PTH",      # pathlib over os.path
  "ERA",      # commented-out code
  "T20",      # stray print()
  "RET",      # return statements
  "TRY",      # exception handling
  "PERF",     # performance
]
ignore = [
  "TRY003",   # long messages in exception constructors are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001"]  # fixtures are injected by name and may go unused

[tool.ruff.lint.isort]
known-first-party = ["asknews"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
pretty = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: needs a PostgreSQL database (set DATABASE_URL)",
]
xfail_strict = true

[tool.coverage.run]
source = ["asknews"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
