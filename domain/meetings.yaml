# What makes a statement a policy-meeting statement, as substrings of its
# title (Federal Reserve) or of its text (Bank of Japan, whose statements are
# titled by their content). Other statements by the same publishers, such as
# long-run goals or operational notices, do not start a meeting.
statement_titles:
  fed: ["FOMC statement"]
statement_body_markers:
  boj: ["金融政策決定会合"]
# Text that marks an extraordinary meeting ("the extraordinary Monetary Policy
# Meeting held today"); the word alone also appears in "temporary measures".
# The Federal Reserve's calendar marks its own, recorded with the statement.
unscheduled_body_markers:
  boj: ["臨時の金融政策決定会合"]
