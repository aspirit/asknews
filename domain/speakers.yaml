# People whose speeches and press conferences the archive carries.
# `match` lists surname spellings as they appear in transcript titles and
# speech pages; the first match wins. `tenure` marks the period a person
# headed the institution, used when a press conference names nobody.
# Unknown speakers are created on the fly and can be given an entry later.
