# Vocabulary that marks a question as being about the archive. A question
# that mentions none of these, no publisher and no known speaker is declined
# unless lexical retrieval still finds strongly matching passages.
#
# `institutions` lists the words that name each publisher; `recency` lists
# words that ask for the latest material. Both are matched case-insensitively.
institutions:
  fed: [federal reserve, fomc, the fed, "fed ", frb, 連邦準備, 米連邦, ＦＲＢ]
  boj: [bank of japan, boj, 日銀, 日本銀行]
  ecb: [european central bank, ecb, 欧州中央銀行, ＥＣＢ]
  boe: [bank of england, boe, イングランド銀行]
  bis: ["bis ", bank for international settlements, 国際決済銀行]
  bea: [bureau of economic analysis, "bea ", 米経済分析局]
  mof: [ministry of finance, 財務省, 財務相, 財務大臣]
  fsa: [financial services agency, 金融庁]
recency:
  en: [latest, most recent, recent, recently, last week, last month, last meeting, this week,
       this month, this year, yesterday, today, now]
  ja: [最近, 直近, 最新, 先週, 先月, 今週, 今月, 今年, 昨日, 今日, 足元, 前回]
